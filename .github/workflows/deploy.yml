name: Deploy MkDocs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NO_MKDOCS_2_WARNING: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Upload artifact for Helios
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-helios:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HELIOS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.HELIOS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.HELIOS_PORT }} -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            site/ \
            ${{ secrets.HELIOS_USER }}@${{ secrets.HELIOS_HOST }}:${{ secrets.HELIOS_PATH }}

      - name: Healthcheck
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.HELIOS_URL }})
          if [ "$STATUS" != "200" ]; then
            echo "Healthcheck failed: HTTP $STATUS"
            exit 1
          fi
          if ! curl -s ${{ secrets.HELIOS_URL }} | grep -q "Результаты исследований"; then
            echo "Healthcheck failed: контрольная строка не найдена"
            exit 1
          fi
          echo "Healthcheck OK"