name: Publish version

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example v1.1
        required: true
      update_latest:
        description: Point the latest alias to this version
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NO_MKDOCS_2_WARNING: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve version
        id: version
        run: echo "name=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Run experiment pipeline
        run: python scripts/run_experiment.py

      - name: Build Sphinx subsite
        run: sphinx-build -b html -d sphinx/_build/doctrees sphinx sphinx/_build/html

      - name: Build site
        run: mkdocs build --strict

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy version to gh-pages
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.name }}"
          if [ "${{ github.event.inputs.update_latest }}" = "false" ]; then
            mike deploy --push --allow-empty --alias-type copy "$VERSION"
          else
            mike deploy --push --update-aliases --allow-empty --alias-type copy "$VERSION" latest
            mike set-default --push --allow-empty latest
          fi
          mike list

      - name: Export published site
        run: |
          mkdir -p _published
          git archive gh-pages | tar -x -C _published

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _published/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
