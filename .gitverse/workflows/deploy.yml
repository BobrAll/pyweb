name: Deploy MkDocs to GitVerse Pages

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

env:
  NO_MKDOCS_2_WARNING: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        timeout-minutes: 5
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Markdown links
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          failures = []
          for path in [Path("README.md"), *Path("docs").rglob("*.md")]:
              text = path.read_text(encoding="utf-8")
              for match in re.finditer(r"\[[^\]]+\]\(([^)]+)\)", text):
                  target = match.group(1).split("#", 1)[0].strip()
                  if not target or "://" in target or target.startswith(("mailto:", "#")):
                      continue
                  candidate = (path.parent / target).resolve()
                  if not candidate.exists():
                      failures.append(f"{path}:{match.start()}: {target}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          PY

      - name: Check spelling
        run: codespell README.md docs

      - name: Strict build
        run: mkdocs build --strict

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        timeout-minutes: 5
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Restore pip cache
        uses: actions/cache/restore@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Build Sphinx version
        run: |
          sphinx-build -b html sphinx sphinx/_build/html
          rm -rf site/sphinx
          cp -r sphinx/_build/html site/sphinx

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: site/

  deploy:
    needs: build
    if: ${{ gitverse.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitVerse Pages
        uses: actions/deploy-pages@v1
