site_name: Результаты исследований
site_description: Публикация результатов экспериментов
site_author: Александр Бобрусь
site_url: https://bobrall.github.io/pyweb/

theme:
  name: material
  language: ru
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Темная тема
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Светлая тема

extra_css:
  - stylesheets/stress.css

plugins:
  - search
  - macros:
      include_dir: docs/_data
      on_undefined: strict

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Главная: index.md
  - Методика: methodology.md
  - Эксперименты: experiments/index.md
  - Стресс-тест: stress/index.md
  - Отчёт:
      - P1 CI/CD: report/p1.md
      - P2 Стресс-тест: report/p2.md
      - P4 Helios: report/helios-p4.md
      - Измерения: report/measurements.md
  - Лицензии: licenses.md
